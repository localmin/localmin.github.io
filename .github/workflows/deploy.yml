name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # The build only reads the repository. Pages write access belongs to deploy,
    # which does not run for pull requests.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v5

      - name: Install, build, and upload your site
        uses: withastro/action@v5
        # with:
        #   path: .
        #   node-version: 20
        #   package-manager: pnpm@latest

  deploy:
    needs: build
    # Pull requests run the build as a check only; deployment happens on main.
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
      actions: read  # required by deploy-pages@v4
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
